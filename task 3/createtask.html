function addTask() {

      const text = taskInput.value.trim();

      if (text === "") {
        alert("Please enter a task.");
        return;
      }

      const newTask = {
        id: Date.now(),
        text: text,
        completed: false
      };

      tasks.push(newTask);

      saveTasks();

      taskInput.value = "";

      renderTasks();

      taskInput.focus();
    }
